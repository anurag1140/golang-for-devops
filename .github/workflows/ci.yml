name: Go CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Go Version
        run: go version

      - name: Download Dependencies
        run: go mod download

      - name: Verify Modules
        run: go mod verify

      - name: Format
        run: gofmt -w .

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run

      - name: Test
        run: go test ./...

      - name: Build Project
        run: go build ./...